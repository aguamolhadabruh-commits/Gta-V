<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Games Launcher - Grand Theft Auto V Installer</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .instalador-box {
            background-color: #161616;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 40px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .logo-rockstar-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 16px;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitulo {
            color: #868686;
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .barra-fundo {
            background-color: #2a2a2a;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .barra-progresso {
            background-color: #fcaf17;
            width: 0%; 
            height: 100%;
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            color: #aaaaaa;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        #status-texto {
            color: #fcaf17;
            font-weight: 500;
        }

        #bloqueio-inicial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(22, 22, 22, 0.96);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50; 
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-retomar {
            background-color: #fcaf17;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .btn-retomar:hover {
            background-color: #e09b12;
        }

        /* ANIMAÇÃO PARA PISCAR A TELA */
        @keyframes strobe {
            0% { background-color: black; }
            49% { background-color: black; }
            50% { background-color: #ff0000; } 
            99% { background-color: #ff0000; }
            100% { background-color: black; }
        }

        /* ANIMAÇÃO PARA FAZER A IMAGEM AUMENTAR E DIMINUIR (PULSAR) */
        @keyframes pulsar {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.2); } /* Aumenta até 120% do tamanho */
            100% { transform: scale(0.9); } /* Diminui de volta */
        }

        #jumpscare-container {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; 
            justify-content: center;
            align-items: center;
        }

        .efeito-piscar {
            animation: strobe 0.1s infinite;
        }

        /* CONFIGURAÇÃO DA IMAGEM EM TELA CHEIA ANIMADA */
        #jumpscare-img {
            max-width: 90%;  
            max-height: 90%; 
            object-fit: contain; 
            border-radius: 12px;
            /* Ativa a animação de pulsação contínua e bem rápida */
            animation: pulsar 0.2s infinite ease-in-out; 
        }
    </style>
</head>
<body>

    <div class="instalador-box" id="painel">
        <div id="bloqueio-inicial">
            <p style="color: #fcaf17; font-weight: bold; margin-bottom: 5px;">Download Pausado</p>
            <p style="font-size: 0.9rem; color: #aaa; margin: 0 0 15px 0;">Clique abaixo para sincronizar com os servidores da Rockstar e retomar.</p>
            <button class="btn-retomar" onclick="iniciarInstalacao()">Verificar e Instalar</button>
        </div>

        <img src="rockstar.png" class="logo-rockstar-img" alt="Rockstar Games">
        
        <h1>Grand Theft Auto V</h1>
        <div class="subtitulo">Instalador de Atualizações Oficial v2.04</div>

        <div class="barra-fundo">
            <div class="barra-progresso" id="barra"></div>
        </div>

        <div class="status-container">
            <span id="status-texto">Aguardando autorização...</span>
            <span id="porcentagem">0%</span>
        </div>
    </div>

    <!-- Elemento do Jumpscare -->
    <div id="jumpscare-container">
        <img id="jumpscare-img" src="jeffkill.jpg" alt="Susto">
    </div>

    <!-- Áudio personalizado -->
    <audio id="grito-audio" src="screamjeff.mp3" preload="auto"></audio>

    <script>
        const textosStatus = [
            "Conectando aos servidores da Rockstar Games...",
            "Alocando espaço em disco (115 GB)...",
            "Baixando pacote básico de arquivos (gta5.exe)...",
            "Baixando texturas em alta definição (x64a.rpf)...",
            "Descompactando arquivos de áudio e dublagem...",
            "Baixando dados do GTA Online (Los Santos Drug Wars)...",
            "Instalando complementos Microsoft DirectX e Social Club...",
            "Verificando integridade dos arquivos baixados...",
            "Finalizando instalação e criando atalhos..."
        ];

        let progresso = 0;
        const elementoBarra = document.getElementById('barra');
        const elementoPorcentagem = document.getElementById('porcentagem');
        const elementoTexto = document.getElementById('status-texto');

        function iniciarInstalacao() {
            document.getElementById('bloqueio-inicial').style.display = 'none';
            
            const audio = document.getElementById('grito-audio');
            audio.play().then(() => {
                audio.pause(); 
                audio.currentTime = 0;
            }).catch(e => console.log(e));

            setTimeout(atualizarCarregamento, 500);
        }

        function atualizarCarregamento() {
            if (progresso < 100) {
                progresso += Math.floor(Math.random() * 3) + 1; 
                if (progresso > 100) progresso = 100;

                elementoBarra.style.width = progresso + '%';
                elementoPorcentagem.innerText = progresso + '%';

                const indexTexto = Math.floor((progresso / 100) * textosStatus.length);
                if (textosStatus[indexTexto]) {
                    elementoTexto.innerText = textosStatus[indexTexto];
                }

                setTimeout(atualizarCarregamento, Math.random() * 200 + 150);
            } else {
                setTimeout(ativarSusto, 500);
            }
        }

        function ativarSusto() {
            const container = document.getElementById('jumpscare-container');
            const audio = document.getElementById('grito-audio');

            container.style.display = 'flex';
            container.classList.add('efeito-piscar');
            
            audio.volume = 1.0;
            audio.play().catch(error => {
                console.log("Erro de áudio automático.", error);
            });

            if (navigator.vibrate) {
                navigator.vibrate(500); 
            }
        }
    </script>

</body>
</html>
