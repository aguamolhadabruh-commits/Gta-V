<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial 🎃</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-align: center;
            padding: 0 20px;
        }

        .container-botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.3rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #btn-sim {
            background-color: #ff6600;
            color: white;
            z-index: 10;
        }

        #btn-nao {
            background-color: #333333;
            color: #ff6600;
            position: fixed;
            top: 55%; 
            left: 60%; 
            z-index: 5;
        }

        /* ANIMAÇÃO PARA PISCAR A TELA */
        @keyframes strobe {
            0% { background-color: black; }
            49% { background-color: black; }
            50% { background-color: #ff0000; } /* Pisca em vermelho de fundo */
            99% { background-color: #ff0000; }
            100% { background-color: black; }
        }

        /* CONTAINER DO JUMPSCARE COM EFEITO PISCANTE */
        #jumpscare-container {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; 
            justify-content: center;
            align-items: center;
        }

        .efeito-piscar {
            animation: strobe 0.1s infinite;
        }

        /* AJUSTE DO TAMANHO DA IMAGEM PARA NÃO FICAR MUITO GRANDE */
        #jumpscare-img {
            max-width: 85%;  
            max-height: 85%; 
            object-fit: contain; 
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <h1>Quer comemorar o Halloween comigo? 🎃</h1>

    <div class="container-botoes">
        <button id="btn-sim" onclick="ativarSusto()">🎃 Sim</button>
        <button id="btn-nao" onmouseover="fugir()" onclick="fugir()" ontouchstart="fugir()">🕸 Não</button>
    </div>

    <!-- Elemento do Jumpscare -->
    <div id="jumpscare-container">
        <img id="jumpscare-img" src="jeffkill.jpg" alt="Susto">
    </div>

    <!-- Áudio alterado para o seu arquivo local screamjeff.mp3 -->
    <audio id="grito-audio" src="screamjeff.mp3" preload="auto"></audio>

    <script>
        function fugir() {
            const botaoNao = document.getElementById('btn-nao');
            const larguraJanela = window.innerWidth - 160;
            const alturaJanela = window.innerHeight - 80;

            let novaPosicaoX = Math.floor(Math.random() * larguraJanela);
            let novaPosicaoY = Math.floor(Math.random() * alturaJanela);

            const botaoSim = document.getElementById('btn-sim').getBoundingClientRect();
            
            if (Math.abs(novaPosicaoX - botaoSim.left) < 150 && Math.abs(novaPosicaoY - botaoSim.top) < 100) {
                novaPosicaoX = (novaPosicaoX + 200) % larguraJanela;
                novaPosicaoY = (novaPosicaoY + 200) % alturaJanela;
            }

            botaoNao.style.left = novaPosicaoX + 'px';
            botaoNao.style.top = novaPosicaoY + 'px';
        }

        function ativarSusto() {
            const container = document.getElementById('jumpscare-container');
            const audio = document.getElementById('grito-audio');

            container.style.display = 'flex';
            container.classList.add('efeito-piscar');
            
            audio.volume = 1.0;
            audio.play().catch(error => {
                console.log("Erro ao reproduzir o som:", error);
            });

            if (navigator.vibrate) {
                navigator.vibrate(500); 
            }
        }
    </script>

</body>
</html>
