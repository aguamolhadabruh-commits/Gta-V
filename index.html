<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial 🎃</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .container-botoes {
            display: flex;
            gap: 20px;
            position: relative;
            width: 300px;
            height: 100px;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #btn-sim {
            background-color: #ff6600;
            color: white;
        }

        #btn-nao {
            background-color: #333333;
            color: #ff6600;
            position: absolute;
        }

        /* ESTILO DO JUMPSCARE (Fica escondido até o clique) */
        #jumpscare-container {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; 
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <h1>Quer comemorar o Halloween comigo? 🎃</h1>

    <div class="container-botoes">
        <button id="btn-sim" onclick="ativarSusto()">🎃 Sim</button>
        <button id="btn-nao" onmouseover="fugir()" onclick="fugir()">🕸 Não</button>
    </div>

    <!-- Elemento do Jumpscare com o seu arquivo de imagem local -->
    <div id="jumpscare-container">
        <img id="jumpscare-img" src="jeffkill.jpg" alt="Susto">
    </div>

    <!-- Áudio do grito (Link direto para um som de terror) -->
    <audio id="grito-audio" src="https://soundjay.com" preload="auto"></audio>

    <script>
        function fugir() {
            const botaoNao = document.getElementById('btn-nao');
            const larguraJanela = window.innerWidth - 150;
            const alturaJanela = window.innerHeight - 100;

            const novaPosicaoX = Math.floor(Math.random() * larguraJanela);
            const novaPosicaoY = Math.floor(Math.random() * alturaJanela);

            botaoNao.style.position = 'fixed';
            botaoNao.style.left = novaPosicaoX + 'px';
            botaoNao.style.top = novaPosicaoY + 'px';
        }

        function activarSusto() {
            const container = document.getElementById('jumpscare-container');
            const audio = document.getElementById('grito-audio');

            // 1. Mostra a imagem em tela cheia
            container.style.display = 'flex';

            // 2. Coloca o volume no máximo e toca o som do grito
            audio.volume = 1.0;
            audio.play().catch(error => {
                console.log("O navegador bloqueou o áudio automático temporariamente.", error);
            });

            // Faz o celular vibrar se a pessoa estiver acessando pelo Android
            if (navigator.vibrate) {
                navigator.vibrate(500); // Vibra por meio segundo
            }
        }
    </script>

</body>
</html>
